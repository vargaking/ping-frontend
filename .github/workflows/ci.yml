name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # $env/static/public is resolved at build/check time, so the PUBLIC_* vars
      # must exist. Seed them from the committed example (no secrets involved).
      - name: Seed public env
        run: cp .env.example .env

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Type check (svelte-check)
        run: npm run check

      - name: Build
        run: npm run build
