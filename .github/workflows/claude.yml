name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # This job runs the branch's code with a write token, so never on a fork's branch.
      - name: Skip fork PRs
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          fork=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          echo "fork=$fork" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.pr.outputs.fork == 'false'
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.fork == 'false'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.pr.outputs.fork == 'false'
        run: |
          npm ci
          cp .env.example .env

      - uses: anthropics/claude-code-action@v1
        if: steps.pr.outputs.fork == 'false'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Comments from anyone else never reach the agent.
          include_comments_by_actor: vargaking,claude[bot]
          claude_args: |
            --model sonnet
            --max-turns 60
            --allowedTools "Bash(npm ci),Bash(npm run lint),Bash(npm run check),Bash(npm run format),Bash(npm test),Bash(npm test:*),Bash(npx prettier:*),Bash(npx vitest:*)"
