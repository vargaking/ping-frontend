name: Desktop

on:
  push:
    branches: [master]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag_exists: ${{ steps.read.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: read
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          tag="desktop-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            exists=true
          else
            exists=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Version bumped if the installer changed
        if: github.event_name == 'pull_request' && steps.read.outputs.tag_exists == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          shipped=$(git diff --name-only "$BASE...$HEAD" -- \
            desktop/src desktop/static desktop/assets \
            desktop/package.json desktop/package-lock.json desktop/electron-builder.yml)
          if [ -n "$shipped" ]; then
            echo "$shipped"
            echo "::error::This PR changes files that ship in the installer, but desktop-v$VERSION is already released. Bump the version in desktop/package.json."
            exit 1
          fi

  windows:
    needs: [check, version]
    if: github.event_name == 'pull_request' || needs.version.outputs.tag_exists == 'false'
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: zet-windows
          path: desktop/release/Zet-Setup.exe
          retention-days: 7
          if-no-files-found: error

  linux:
    needs: [check, version]
    if: github.event_name == 'pull_request' || needs.version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: zet-linux
          path: desktop/release/Zet.AppImage
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [version, windows, linux]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zet-windows

      - uses: actions/download-artifact@v4
        with:
          name: zet-linux

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-v${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" Zet-Setup.exe Zet.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Zet desktop ${TAG#desktop-v}" \
            --notes "Windows: Zet-Setup.exe. Linux: Zet.AppImage (move it somewhere permanent, make it executable, then run it; it adds itself to your app launcher)." \
            --latest
          echo "Released $TAG at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  skipped:
    needs: version
    if: github.event_name != 'pull_request' && needs.version.outputs.tag_exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "Skipped: desktop-v$VERSION is already released. Bump the version in desktop/package.json to release again." >> "$GITHUB_STEP_SUMMARY"
