name: Desktop

on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check

  windows:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Tag matches package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "desktop-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: zet-windows
          path: desktop/release/*.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
