appId: app.zetchat.desktop
productName: Zet
publish: null
npmRebuild: false
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - static/**
  - assets/tray*.png
  - assets/overlay*.png
  - assets/icon.png
  - licenses/**
asarUnpack:
  - node_modules/@vencord/venmic/**
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: true
  perMachine: false
  artifactName: Zet-Setup.${ext}
mac:
  target: dmg
  icon: assets/icon.png
linux:
  target: AppImage
  artifactName: Zet.${ext}
  executableName: zet
  icon: assets/icon.png
  category: Network
