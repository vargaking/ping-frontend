<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"
		/>
		<title>Share your screen</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: flex;
				flex-direction: column;
				background: #0d0f11;
				color: #e6edf3;
				font-family: system-ui, sans-serif;
				font-size: 14px;
			}
			#list {
				flex: 1;
				overflow-y: auto;
				padding: 16px 20px;
			}
			h2 {
				margin: 0 0 10px;
				font-size: 12px;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: #8ab4d8;
			}
			section + section {
				margin-top: 20px;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 12px;
			}
			.card {
				display: flex;
				flex-direction: column;
				gap: 6px;
				padding: 8px;
				background: #151a1f;
				border: 2px solid transparent;
				border-radius: 8px;
				color: inherit;
				font: inherit;
				text-align: left;
				cursor: pointer;
			}
			.card:hover {
				background: #1b2128;
			}
			.card[aria-pressed='true'] {
				border-color: #8ab4d8;
			}
			.card img.thumb {
				width: 100%;
				aspect-ratio: 16 / 9;
				object-fit: contain;
				background: #000;
				border-radius: 4px;
			}
			.name {
				display: flex;
				align-items: center;
				gap: 6px;
				min-width: 0;
			}
			.name img {
				width: 16px;
				height: 16px;
			}
			.name span {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			footer {
				display: flex;
				justify-content: flex-end;
				gap: 8px;
				padding: 12px 20px;
				border-top: 1px solid #222a32;
			}
			footer button {
				padding: 6px 18px;
				border-radius: 6px;
				border: 1px solid #8ab4d8;
				background: transparent;
				color: #8ab4d8;
				font: inherit;
				cursor: pointer;
			}
			footer button.primary {
				background: #8ab4d8;
				color: #0d0f11;
			}
			footer button:disabled {
				opacity: 0.4;
				cursor: not-allowed;
			}
		</style>
	</head>
	<body>
		<div id="list"></div>
		<footer>
			<button id="cancel" type="button">Cancel</button>
			<button id="share" type="button" class="primary" disabled>Share</button>
		</footer>
		<script>
			const list = document.getElementById('list');
			const shareButton = document.getElementById('share');
			let selected = null;

			function select(id) {
				selected = id;
				shareButton.disabled = false;
				for (const card of list.querySelectorAll('.card')) {
					card.setAttribute('aria-pressed', String(card.dataset.id === id));
				}
			}

			function card(source) {
				const el = document.createElement('button');
				el.type = 'button';
				el.className = 'card';
				el.dataset.id = source.id;
				el.setAttribute('aria-pressed', 'false');

				const thumb = document.createElement('img');
				thumb.className = 'thumb';
				thumb.alt = '';
				thumb.src = source.thumbnail;

				const name = document.createElement('div');
				name.className = 'name';
				if (source.icon) {
					const icon = document.createElement('img');
					icon.alt = '';
					icon.src = source.icon;
					name.append(icon);
				}
				const label = document.createElement('span');
				label.textContent = source.name;
				label.title = source.name;
				name.append(label);

				el.append(thumb, name);
				el.addEventListener('click', () => select(source.id));
				el.addEventListener('dblclick', () => window.picker.choose(source.id));
				return el;
			}

			function section(title, sources) {
				if (sources.length === 0) return;
				const el = document.createElement('section');
				const heading = document.createElement('h2');
				heading.textContent = title;
				const grid = document.createElement('div');
				grid.className = 'grid';
				grid.append(...sources.map(card));
				el.append(heading, grid);
				list.append(el);
			}

			window.picker.onSources((sources) => {
				section(
					'Screens',
					sources.filter((source) => source.kind === 'screen')
				);
				section(
					'Windows',
					sources.filter((source) => source.kind === 'window')
				);
			});

			shareButton.addEventListener('click', () => selected && window.picker.choose(selected));
			document.getElementById('cancel').addEventListener('click', () => window.picker.cancel());
			window.addEventListener('keydown', (event) => {
				if (event.key === 'Escape') window.picker.cancel();
			});
		</script>
	</body>
</html>
