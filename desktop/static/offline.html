<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"
		/>
		<title>Zet</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				background: #0d0f11;
				color: #8ab4d8;
				font-family: system-ui, sans-serif;
			}
			main {
				height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
			}
			svg {
				width: 44px;
				height: 44px;
			}
			p {
				margin: 0;
				font-size: 15px;
			}
			button {
				background: transparent;
				color: inherit;
				border: 1px solid #8ab4d8;
				border-radius: 6px;
				padding: 6px 16px;
				font: inherit;
				cursor: pointer;
			}
			button:hover {
				background: rgba(138, 180, 216, 0.12);
			}
		</style>
	</head>
	<body>
		<main>
			<svg viewBox="0 0 512 512" aria-hidden="true">
				<g
					fill="none"
					stroke="#8ab4d8"
					stroke-width="54"
					stroke-linecap="round"
					stroke-linejoin="round"
				>
					<path d="M156 146H356M156 366H356" />
					<path d="M356 146L156 366" />
				</g>
			</svg>
			<p>Can't reach Zet. Retrying…</p>
			<button id="retry" type="button">Retry</button>
		</main>
		<script>
			const retry = () => window.zetDesktop?.retry();
			document.getElementById('retry').addEventListener('click', retry);
			window.addEventListener('online', retry);
			setTimeout(retry, 5000);
		</script>
	</body>
</html>
